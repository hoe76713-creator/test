name: Elevator Answer Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elevator-answer-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python files
        run: python -m py_compile assistant_bridge.py run_audit.py

      - name: Generate 10 actual answers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

          python run_audit.py \
            --app-dir . \
            --output audit-results \
            --live \
            --limit 10

      - name: Save audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elevator-audit-${{ github.run_number }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 7
